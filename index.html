<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperamentos: Matriz Neurobiológica dos 4 Temperamentos</title>
    <meta name="description" content="Mapeamento psicométrico dos 4 temperamentos integrando o modelo PEN de Eysenck e o Fisher Temperament Inventory em 4 eixos neurobiológicos." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('temperament_axes_theme');
          var isDark = saved ? saved === 'dark' : true;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f3f2ea] text-[#18191b] dark:bg-[#1e1e1e] dark:text-[#d4d4d4] antialiased selection:bg-[#78c6b5]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
